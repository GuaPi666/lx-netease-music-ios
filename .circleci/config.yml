# LX Music iOS Build - CircleCI Configuration
# Builds unsigned IPA for jailbroken iOS 16.1+ devices
#
# Setup:
# 1. Push this file to main branch
# 2. Go to https://app.circleci.com/projects/ and enable this repo
# 3. Build will run automatically on push
#
# Free plan: 250 min/month macOS build time

version: 2.1

orbs:
  node: circleci/node@5.1.0

jobs:
  build-ios:
    macos:
      xcode: 15.4.0  # Xcode 15.4 on macOS 14
    environment:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1

    steps:
      - checkout

      # Install Node.js 20
      - node/install:
          node-version: '20.18'

      # Restore npm cache
      - restore_cache:
          keys:
            - npm-deps-{{ checksum "package-lock.json" }}
            - npm-deps-

      # Install npm dependencies
      - run:
          name: Install npm dependencies
          command: |
            npm install --ignore-scripts
            node patchMediaLayout.js

      # Save npm cache
      - save_cache:
          key: npm-deps-{{ checksum "package-lock.json" }}
          paths:
            - ./node_modules

      # Install ldid (fake-sign tool)
      - run:
          name: Install ldid
          command: |
            if ! command -v ldid &> /dev/null; then
              brew install ldid
            fi

      # Install CocoaPods
      - run:
          name: Install CocoaPods
          command: |
            gem install cocoapods --no-document

      # Restore Pods cache
      - restore_cache:
          keys:
            - pods-{{ checksum "ios/Podfile.lock" }}
            - pods-

      # Install Pods
      - run:
          name: Install Pods
          command: |
            cd ios
            pod install --repo-update

      # Save Pods cache
      - save_cache:
          key: pods-{{ checksum "ios/Podfile.lock" }}
          paths:
            - ./ios/Pods

      # Generate JS Bundle
      - run:
          name: Generate JS Bundle
          command: |
            mkdir -p ios/build
            npx react-native bundle \
              --platform ios \
              --dev false \
              --entry-file index.js \
              --bundle-output ios/build/main.jsbundle \
              --assets-dest ios/build/assets

      # Generate entitlements for fake-sign
      - run:
          name: Generate entitlements
          command: |
            cat > ios/build/entitlements.plist << 'EOP'
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
              <key>get-task-allow</key>
              <true/>
              <key>application-identifier</key>
              <string>com.lxmusic.ios</string>
              <key>keychain-access-groups</key>
              <array>
                <string>com.lxmusic.ios</string>
              </array>
            </dict>
            </plist>
            EOP

      # Build .app (unsigned)
      - run:
          name: Build unsigned .app
          command: |
            cd ios
            xcodebuild \
              -workspace LxMusic.xcworkspace \
              -scheme LxMusic \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath ./build/derived \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              clean build \
              BUILD_DIR=./build/Build

      # Locate .app
      - run:
          name: Locate and prepare .app
          command: |
            APP_PATH=$(find ios/build -name "LxMusic.app" -type d -path "*/Release-iphoneos/*" | head -1)
            echo "Found .app at: $APP_PATH"

            # Copy JS bundle into .app
            cp ios/build/main.jsbundle "$APP_PATH/main.jsbundle"
            if [ -d ios/build/assets ]; then
              cp -R ios/build/assets "$APP_PATH/assets"
            fi

            # Remove any existing _CodeSignature
            rm -rf "$APP_PATH/_CodeSignature" 2>/dev/null || true

            # Fake-sign with ldid
            ldid -Sios/build/entitlements.plist "$APP_PATH/LxMusic"

            # Create IPA
            mkdir -p ios/build/Payload
            cp -R "$APP_PATH" ios/build/Payload/
            cd ios/build
            zip -r LxMusic-unsigned.ipa Payload/ -x "*.DS_Store"
            echo "IPA created at: $(pwd)/LxMusic-unsigned.ipa"

      # Store IPA as artifact
      - store_artifacts:
          path: ios/build/LxMusic-unsigned.ipa
          destination: LxMusic-unsigned.ipa

workflows:
  version: 2
  build:
    jobs:
      - build-ios:
          filters:
            branches:
              only:
                - main
                - /ios-.*/
