# LX Music iOS Build — Codemagic CI
# https://codemagic.io/   Free plan: 500 min/month macOS build time
#
# Setup:
# 1. Go to https://codemagic.io/start — log in with GitHub
# 2. Click "Add application" → Select your GitHub repo
# 3. Pick "React Native" template → Confirm
# 4. Codemagic will auto-detect codemagic.yaml
# 5. Every push to main or ios-* triggers a build
#
# After build: go to "Artifacts" tab → download LxMusic-unsigned.ipa

workflows:
  ios-build:
    name: iOS Build (Unsigned / Fake-Signed)
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      vars:
        XCODE_WORKSPACE: "ios/LxMusic.xcworkspace"
        XCODE_SCHEME: "LxMusic"
      node: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: ios-*
          include: true
    scripts:
      # Step 1: Install npm dependencies
      - name: Install npm dependencies
        script: |
          npm install --ignore-scripts
          node patchMediaLayout.js 2>/dev/null || true
          # Patch react-native-track-player fork (TypeScript source → needs lib/ entry)
          node patchTrackPlayer.js

      # Step 2: Install CocoaPods (Codemagic already has it, ensure latest)
      - name: Ensure CocoaPods
        script: |
          echo "Ruby: $(ruby --version)"
          echo "Pod: $(pod --version 2>/dev/null || echo not-installed)"
          # Only install if missing
          if ! command -v pod &> /dev/null; then
            sudo gem install cocoapods --no-document
          fi

      # Step 3: Install Pods (no --repo-update for speed)
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --verbose

      # Step 4: Generate JS Bundle
      - name: Generate JS Bundle
        script: |
          mkdir -p ios/build
          npx react-native bundle \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output ios/build/main.jsbundle \
            --assets-dest ios/build/assets

      # Step 5: Build unsigned .app
      - name: Build unsigned .app
        script: |
          cd ios
          # Gather all Pod header directories into one space-separated string
          PODS_ROOT="$PWD/Pods"
          HEADER_DIRS='$(inherited)'
          for d in "$PODS_ROOT"/Headers/Public/*; do
            [ -d "$d" ] && HEADER_DIRS="$HEADER_DIRS $d"
          done
          [ -d "$PODS_ROOT/Headers/Public" ] && HEADER_DIRS="$HEADER_DIRS $PODS_ROOT/Headers/Public"

          echo "HEADER_SEARCH_PATHS=$HEADER_DIRS"

          xcodebuild \
            -workspace LxMusic.xcworkspace \
            -scheme LxMusic \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            "HEADER_SEARCH_PATHS=$HEADER_DIRS" \
            clean build \
            BUILD_DIR="$PWD/build/Build"

      # Step 6: Locate .app, inject bundle, fake-sign, create IPA
      - name: Package unsigned IPA
        script: |
          cd ios

          # Verify JS bundle exists
          if [ ! -f build/main.jsbundle ]; then
            echo "ERROR: JS bundle not found at ios/build/main.jsbundle"
            ls -la build/ 2>/dev/null || echo "build/ directory is empty"
            exit 1
          fi
          echo "JS bundle found: $(wc -c < build/main.jsbundle) bytes"

          # Find the .app
          APP_PATH=$(find "$PWD/build/Build" -name "LxMusic.app" -type d -path "*/Release-iphoneos/*" | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$PWD/build" -name "*.app" -type d | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find LxMusic.app"
            find "$PWD/build" -type d -maxdepth 5 2>/dev/null
            exit 1
          fi
          echo "Found .app at: $APP_PATH"

          # Copy JS bundle into .app (use absolute paths, no error suppression)
          cp "$PWD/build/main.jsbundle" "$APP_PATH/main.jsbundle"
          if [ -d "$PWD/build/assets" ]; then
            cp -R "$PWD/build/assets" "$APP_PATH/assets"
          fi

          # Verify bundle was copied
          if [ ! -f "$APP_PATH/main.jsbundle" ]; then
            echo "ERROR: Failed to copy JS bundle into .app"
            exit 1
          fi
          echo "JS bundle in .app: $(wc -c < "$APP_PATH/main.jsbundle") bytes"
          ls -la "$APP_PATH/"

          # Remove any existing _CodeSignature
          rm -rf "$APP_PATH/_CodeSignature" 2>/dev/null || true

          # Install ldid
          if ! command -v ldid &> /dev/null; then
            brew install ldid
          fi

          # Fake-sign
          ldid -S entitlements.plist "$APP_PATH/LxMusic"

          # Create IPA
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r LxMusic-unsigned.ipa Payload/ -x "*.DS_Store"
          echo "IPA created at: $(pwd)/LxMusic-unsigned.ipa"
          ls -lh LxMusic-unsigned.ipa

    artifacts:
      - ios/build/LxMusic-unsigned.ipa
      - ios/build/*.ipa
    # Cache CocoaPods between builds
    cache:
      cache_paths:
        - ~/.cocoapods
        - ios/Pods
        - node_modules
    publishing:
      email:
        recipients:
          - 2951629785@qq.com
        notify:
          success: true
          failure: true
